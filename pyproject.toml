[project]
name = "roboliga-server"
# The version should follow SemVer where meta string is the year of the competition
version = "1.0.0+2026"
description = "REST API and camera tracking server for RoboLiga robot competitions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "gevent==26.8.0",
    "orjson==3.12.0",
    "shapely==2.1.2",
    "flask-cors==6.0.5",
    "flask_restx==1.3.2",
    "flask_httpauth==4.8.1",
    "pyyaml==6.0.3",
    "random_username==1.0.2",
]

[dependency-groups]
# OpenCV with GUI support, needed for --setup and the tracker preview window
gui = [
    "sledenje-objektom-2[gui]",
]
# OpenCV without GUI support, for servers and containers
headless = [
    "sledenje-objektom-2[headless]",
]

[tool.uv.sources]
sledenje-objektom-2 = { git = "https://github.com/RoboLiga/sledenje-objektom.git" }

[tool.uv]
package = false
default-groups = ["gui"]
conflicts = [
    [{ group = "gui" }, { group = "headless" }],
]
